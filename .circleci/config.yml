version: 2.1

# Core CI on CircleCI. Mirrors .github/workflows/core-ci.yml job for job, and
# runs CodeQL as well (.github/workflows/codeql.yml).
# GitHub Actions is blocked for the org by a billing lock, so this runs the
# same checks until Actions is back. Note: the main ruleset pins its required
# checks to the GitHub Actions app, so these results are informational until
# that ruleset says otherwise.

executors:
  python-311:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project

  python-312:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project

  # The dependency audit needs Python (pip-audit, severity check) and npm.
  python-312-node:
    docker:
      - image: cimg/python:3.12-node
    working_directory: ~/project

  python-311-postgres:
    docker:
      - image: cimg/python:3.11
      - image: postgres:16
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Admin
          POSTGRES_DB: filaops
    environment:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: filaops
      DB_USER: postgres
      DB_PASSWORD: Admin
      DATABASE_URL: postgresql+psycopg://postgres:Admin@localhost:5432/filaops
      ENVIRONMENT: test
      SECRET_KEY: ci-test-secret-key-not-for-production-use
      DEBUG: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    working_directory: ~/project

  node:
    docker:
      - image: cimg/node:24
    working_directory: ~/project

commands:
  fetch_main:
    steps:
      - run:
          name: Fetch main for diff checks
          command: git fetch origin main:refs/remotes/origin/main

  install_backend_dependencies:
    steps:
      - restore_cache:
          keys:
            - v1-pip-backend-{{ checksum "backend/requirements.txt" }}
      - run:
          name: Install backend dependencies
          command: |
            cd backend
            python -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
      - save_cache:
          key: v1-pip-backend-{{ checksum "backend/requirements.txt" }}
          paths:
            - ~/.cache/pip

  # The CodeQL command-line bundle, version and checksum pinned.
  install_codeql:
    steps:
      - restore_cache:
          keys:
            - v1-codeql-bundle-v2.27.5
      - run:
          name: Install the CodeQL bundle
          environment:
            CODEQL_BUNDLE_VERSION: codeql-bundle-v2.27.5
            CODEQL_BUNDLE_SHA256: a5f205466b976ea9b345957fc133eeea9021e71aeffc99243ec7b9e99b1d6ed5
          command: |
            set -euo pipefail
            if [ ! -x "$HOME/codeql/codeql" ]; then
              curl --fail --silent --show-error --location \
                --output /tmp/codeql-bundle.tar.gz \
                "https://github.com/github/codeql-action/releases/download/${CODEQL_BUNDLE_VERSION}/codeql-bundle-linux64.tar.gz"
              echo "${CODEQL_BUNDLE_SHA256}  /tmp/codeql-bundle.tar.gz" | sha256sum --check -
              tar --extract --gzip --file /tmp/codeql-bundle.tar.gz --directory "$HOME"
              rm /tmp/codeql-bundle.tar.gz
            fi
            "$HOME/codeql/codeql" version
      - save_cache:
          key: v1-codeql-bundle-v2.27.5
          paths:
            - ~/codeql

  install_frontend_dependencies:
    steps:
      - restore_cache:
          keys:
            - v1-npm-frontend-{{ checksum "frontend/package-lock.json" }}
      - run:
          name: Install frontend dependencies
          command: cd frontend && npm ci
      - save_cache:
          key: v1-npm-frontend-{{ checksum "frontend/package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  # Repository guardrails: immutable Actions, no local bypass guidance, and
  # security workflows remain attached to pull requests. Same tests as
  # Actions' core-guardrails; they inspect .github/workflows only.
  core-guardrails:
    executor: python-312
    steps:
      - checkout
      - run:
          name: Test repository hardening
          command: python -m unittest scripts.ci.test_guardrail_policy scripts.ci.test_workflow_hardening scripts.ci.test_audit_severity -v

  # Dependency audit gate: high/critical findings block; unclassified findings
  # fail closed rather than being silently ignored.
  core-dependency-audit:
    executor: python-312-node
    steps:
      - checkout
      - run:
          name: Audit Python dependencies
          command: |
            cd backend
            python -m pip install --disable-pip-version-check pip-audit
            set +e
            python -m pip_audit --strict --requirement requirements.txt --format cyclonedx-json --output pip-audit.json
            audit_exit=$?
            set -e
            if [ "$audit_exit" -gt 1 ]; then exit "$audit_exit"; fi
            python ../scripts/ci/check_audit_severity.py pip pip-audit.json
      - run:
          name: Audit JavaScript dependencies
          command: |
            cd frontend
            set +e
            npm audit --json > npm-audit.json
            audit_exit=$?
            set -e
            if [ "$audit_exit" -gt 1 ]; then exit "$audit_exit"; fi
            python ../scripts/ci/check_audit_severity.py npm npm-audit.json

  # Release metadata guard: every runtime and lockfile must report one version.
  core-version-parity:
    executor: python-311
    steps:
      - checkout
      - run:
          name: Test version parity guard
          command: python -m unittest scripts.ci.test_check_version_parity
      - run:
          name: Check repository version parity
          command: python scripts/ci/check_version_parity.py

  core-diff:
    executor: python-311
    steps:
      - checkout
      - fetch_main
      - run:
          name: Check whitespace and conflict markers
          command: git diff --check origin/main...HEAD

  core-pro-guard:
    executor: python-311
    steps:
      - checkout
      - fetch_main
      - run:
          name: Assert Core repo has no PRO code
          command: |
            set -euo pipefail
            if [ -e backend/app/pro ]; then
              echo "backend/app/pro found; PRO code must not be in the public Core repo."
              exit 1
            fi
            if [ -e license-server ]; then
              echo "license-server found; PRO code must not be in the public Core repo."
              exit 1
            fi
            pro_files="$(git diff --name-only origin/main...HEAD | grep -E '^(backend/app/pro($|/)|license-server($|/))' || true)"
            if [ -n "$pro_files" ]; then
              echo "Diff contains PRO-only paths:"
              echo "$pro_files"
              exit 1
            fi
            echo "No PRO code detected; public Core repo is clean."

  core-backend-static:
    executor: python-311
    steps:
      - checkout
      - run:
          name: Compile backend Python files
          command: cd backend && python -m compileall -q app tests

  core-backend-tests:
    executor: python-311-postgres
    steps:
      - checkout
      - install_backend_dependencies
      - run:
          name: Wait for Postgres
          command: |
            cd backend
            . .venv/bin/activate
            python -c '
            import os
            import time

            import psycopg

            deadline = time.time() + 60
            last_error = None
            while time.time() < deadline:
                try:
                    with psycopg.connect(
                        host=os.environ["DB_HOST"],
                        port=os.environ["DB_PORT"],
                        dbname=os.environ["DB_NAME"],
                        user=os.environ["DB_USER"],
                        password=os.environ["DB_PASSWORD"],
                    ):
                        print("Postgres is ready")
                        raise SystemExit(0)
                except Exception as exc:  # pragma: no cover - CI bootstrap
                    last_error = exc
                    time.sleep(2)
            raise SystemExit(f"Postgres did not become ready: {last_error}")
            '
      - run:
          name: Run backend tests
          command: |
            cd backend
            . .venv/bin/activate
            mkdir -p ../test-results/core-backend
            python -m pytest -q --junitxml=../test-results/core-backend/pytest.xml
      - store_test_results:
          path: test-results/core-backend
      - store_artifacts:
          path: test-results/core-backend

  core-frontend-build:
    executor: node
    steps:
      - checkout
      - install_frontend_dependencies
      - run:
          name: Lint frontend
          command: cd frontend && npm run lint:ci
      - run:
          name: Build frontend
          command: cd frontend && npm run build
          environment:
            VITE_API_URL: http://localhost:8001

  core-frontend-unit:
    executor: node
    steps:
      - checkout
      - install_frontend_dependencies
      - run:
          name: Run frontend unit tests
          command: |
            cd frontend
            mkdir -p ../test-results/core-frontend-unit
            npm run test:unit -- --run --reporter=default --reporter=junit --outputFile=../test-results/core-frontend-unit/vitest.xml
      - store_test_results:
          path: test-results/core-frontend-unit
      - store_artifacts:
          path: test-results/core-frontend-unit

  # CodeQL code scanning, run with the CodeQL command-line bundle because
  # GitHub Actions cannot run it while the org's billing lock stands. It
  # analyses one language and uploads the results to GitHub code scanning,
  # which reports them on the pull request the way the Actions workflow did.
  #
  # Two jobs, so that the credential is held by as little as possible:
  # `codeql` analyses one language and hands its SARIF file on; it has no
  # secret. `codeql-upload` sends the files to GitHub and is the only job
  # given the `codeql-upload` context, which holds CODEQL_UPLOAD_TOKEN: a
  # token for this repository only, with "Code scanning alerts: read and
  # write". The token must not be a project environment variable, because
  # every job, the ones that install dependencies and run tests included,
  # would receive it.
  codeql:
    parameters:
      language:
        type: string
    executor: python-312-node
    # 8 GB. On the default 4 GB CodeQL ran out of Java heap on the first query.
    resource_class: large
    steps:
      - checkout
      - install_codeql
      - run:
          name: Build the CodeQL database
          command: |
            set -euo pipefail
            "$HOME/codeql/codeql" database create /tmp/codeql-db \
              --language="<< parameters.language >>" \
              --build-mode=none \
              --source-root=.
      - run:
          name: Analyse
          command: |
            set -euo pipefail
            mkdir -p /tmp/codeql-results
            "$HOME/codeql/codeql" database analyze /tmp/codeql-db \
              --ram=6000 \
              --threads=4 \
              --format=sarif-latest \
              --sarif-category="/language:<< parameters.language >>" \
              --output="/tmp/codeql-results/<< parameters.language >>.sarif"
      - store_artifacts:
          path: /tmp/codeql-results
      - persist_to_workspace:
          root: /tmp
          paths:
            - codeql-results

  # The only job that holds the upload token. It checks out nothing from the
  # repository and installs nothing but the checksum-pinned CodeQL bundle: it
  # reads the SARIF files the analysis jobs handed on and sends them.
  #
  # A pull request from a fork gets no context, so there the analyses run and
  # the upload is skipped. Anywhere else a missing token fails the job: a
  # scan nobody can see is not a scan.
  codeql-upload:
    executor: python-312
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - install_codeql
      - run:
          name: Upload the results to GitHub code scanning
          command: |
            set -euo pipefail
            if [ -z "${CODEQL_UPLOAD_TOKEN:-}" ]; then
              if [ -n "${CIRCLE_PR_NUMBER:-}" ]; then
                echo "Pull request from a fork: no upload token here. Analyses ran; upload skipped."
                exit 0
              fi
              echo "CODEQL_UPLOAD_TOKEN is not set, so the results cannot reach GitHub."
              echo "It belongs in the CircleCI context named codeql-upload."
              exit 1
            fi
            if [ -n "${CIRCLE_PULL_REQUEST:-}" ]; then
              ref="refs/pull/${CIRCLE_PULL_REQUEST##*/}/head"
            else
              ref="refs/heads/${CIRCLE_BRANCH}"
            fi
            for sarif in /tmp/workspace/codeql-results/*.sarif; do
              echo "Uploading ${sarif} for ${ref} at ${CIRCLE_SHA1}"
              GITHUB_TOKEN="${CODEQL_UPLOAD_TOKEN}" "$HOME/codeql/codeql" github upload-results \
                --repository="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" \
                --ref="${ref}" \
                --commit="${CIRCLE_SHA1}" \
                --sarif="${sarif}"
            done

workflows:
  core-ci:
    jobs:
      - codeql:
          name: codeql-<< matrix.language >>
          matrix:
            parameters:
              language: [python, javascript-typescript]
      - codeql-upload:
          context: codeql-upload
          requires:
            - codeql-python
            - codeql-javascript-typescript
      - core-guardrails
      - core-dependency-audit
      - core-version-parity
      - core-diff
      - core-pro-guard
      - core-backend-static
      - core-backend-tests:
          requires:
            - core-diff
            - core-pro-guard
            - core-backend-static
      - core-frontend-build:
          requires:
            - core-diff
            - core-pro-guard
      - core-frontend-unit:
          requires:
            - core-diff
            - core-pro-guard
