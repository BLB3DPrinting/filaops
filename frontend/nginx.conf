# Sanitize the upstream X-Forwarded-Proto header so only "http" or "https"
# are forwarded to the backend. Anything else (e.g. attacker-injected values)
# falls back to nginx's local $scheme, preventing insecure redirect manipulation.
map $http_x_forwarded_proto $forwarded_proto {
    ~^(?i:https)$  https;
    ~^(?i:http)$   http;
    default        $scheme;
}

# The Host header passed to the backend. $http_host is what the browser sent,
# port included ("localhost:8080"). The backend builds its redirects from it
# (FastAPI answers a path that lacks its trailing slash with a 307 to the same
# path with the slash), so without the port an install published on any port
# other than 80 or 443 is redirected to the default port. $host has no port;
# it is only the fallback for a request that has no Host header (HTTP/1.0),
# where $http_host is empty.
map $http_host $backend_host {
    ""       $host;
    default  $http_host;
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Allow file uploads up to 10MB (backend enforces its own 5MB limit)
    client_max_body_size 10m;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy (adjust backend service name as needed)
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Use the proto forwarded by the upstream proxy (e.g. Cloudflare) rather
        # than nginx's local scheme, which is always http behind a TLS terminator.
        # $forwarded_proto is sanitized by the map block above (only http/https allowed).
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Proxy static uploads (product images etc.) from the backend
    location ^~ /static/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $backend_host;
    }

    # Redirect bare /portal to /portal/ so the prefix match below catches it
    location = /portal {
        return 301 /portal/;
    }

    # B2B Portal proxy (served by PRO plugin via FastAPI)
    location ^~ /portal/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Runtime config. docker-entrypoint.sh rewrites this file every time the
    # container starts, so the browser must ask for it on every page load
    # ("no-cache" = keep a copy, but check with the server before using it).
    # An exact match wins over the static-asset pattern below, which would
    # otherwise let the browser keep it for a year. A location with its own
    # add_header does not inherit the server-level ones, so they are repeated.
    location = /config.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
