name: PRO Code Guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-pro-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for PRO code in public repo
        run: |
          FOUND=0

          # Layer 1: Check if PRO directories exist on disk
          if [ -d "backend/app/pro" ]; then
            echo "::error::backend/app/pro/ directory found — PRO code must not be in the public repo"
            FOUND=1
          fi
          if [ -d "license-server" ]; then
            echo "::error::license-server/ directory found — billing infrastructure must not be in the public repo"
            FOUND=1
          fi

          # Layer 2: Scan PR diff for any pro-related file paths
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            diff_base="origin/${GITHUB_BASE_REF}"
          else
            diff_base="origin/main"
          fi
          if ! changed_files=$(git diff --name-only "$diff_base...HEAD"); then
            echo "::error::Unable to compare the change against $diff_base"
            exit 1
          fi
          PR_PRO_FILES=$(printf '%s\n' "$changed_files" | grep -E "^backend/app/pro/|^license-server/" || true)
          if [ -n "$PR_PRO_FILES" ]; then
            echo "::error::PR contains PRO file paths:"
            echo "$PR_PRO_FILES"
            FOUND=1
          fi

          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi
          echo "No PRO code detected — public repo is clean"
